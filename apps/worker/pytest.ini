[pytest]
# apps/worker isn't an installed package, so put it on sys.path; without this a bare
# `pytest` (what CI runs) can't `import worker`, though `python -m pytest` can.
pythonpath = .
markers =
    integration: exercises the real detect/track/pose pipeline against a real video (slow, needs ultralytics+rtmlib+ffmpeg and a sample clip; skips itself if any are missing).
addopts = -m "not integration"
