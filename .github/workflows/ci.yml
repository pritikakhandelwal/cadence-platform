name: CI

on:
  push:
  pull_request:

jobs:
  schema-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/schema/python pytest
      - run: pytest packages/schema/python/tests

  schema-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: packages/schema/typescript
        run: npm install
      - working-directory: packages/schema/typescript
        run: npm run typecheck

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/db pytest
      - run: pytest packages/db/tests

  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/workspace pytest
      - run: pytest packages/workspace/tests

  api:
    runs-on: ubuntu-latest
    # A real Postgres, so the "dialect-agnostic" models are actually checked
    # against one -- not just SQLite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
          POSTGRES_DB: cadence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cadence -d cadence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - working-directory: apps/api
        run: pip install -r requirements.txt
      - name: pytest (SQLite)
        working-directory: apps/api
        run: pytest
      # The image defaults to UTC, which would hide time-zone bugs (session
      # expiry and lockouts were once stored hours off on a non-UTC server --
      # see apps/api/tests/test_datetime_roundtrip.py). Make the server
      # non-UTC so that test has teeth.
      - name: Make the Postgres server non-UTC
        run: PGPASSWORD=cadence psql -h localhost -U cadence -d cadence_test -c "ALTER DATABASE cadence_test SET timezone = 'Asia/Kolkata'"
      - name: pytest (Postgres)
        working-directory: apps/api
        env:
          CADENCE_TEST_DATABASE_URL: postgresql+psycopg2://cadence:cadence@localhost:5432/cadence_test
        run: pytest

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requirements-dev.txt, not requirements.txt: the default test run
      # (pytest.ini excludes -m integration) only exercises pure-logic
      # modules and doesn't need torch/ultralytics/rtmlib/onnxruntime.
      - working-directory: apps/worker
        run: pip install -r requirements-dev.txt
      - working-directory: apps/worker
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: apps/web
        run: npm install
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm test
      - working-directory: apps/web
        run: npm run build

  legacy-streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: legacy/cadence-streamlit
        run: pip install -r requirements-utf8.txt
      - working-directory: legacy/cadence-streamlit
        run: pytest tests
