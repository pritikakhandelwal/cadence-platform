name: CI

on:
  push:
  pull_request:

jobs:
  schema-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/schema/python pytest
      - run: pytest packages/schema/python/tests

  schema-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: packages/schema/typescript
        run: npm install
      - working-directory: packages/schema/typescript
        run: npm run typecheck

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: apps/api
        run: pip install -r requirements.txt
      - working-directory: apps/api
        run: pytest

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: apps/worker
        run: pip install -r requirements.txt
      - working-directory: apps/worker
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: apps/web
        run: npm install
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm run build

  legacy-streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: legacy/cadence-streamlit
        run: pip install -r requirements-utf8.txt
      - working-directory: legacy/cadence-streamlit
        run: pytest tests
