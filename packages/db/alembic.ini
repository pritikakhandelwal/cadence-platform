# Alembic config for the shared schema. Run from packages/db:
#
#     alembic upgrade head                  # uses DATABASE_URL, like the apps do
#     alembic revision --autogenerate -m "what changed"
#
# The database URL is NOT set here: migrations/env.py takes it from DATABASE_URL
# (falling back to the same SQLite default as cadence_db.db), so the CLI, the API
# and the worker all agree on which database they mean.

[alembic]
script_location = %(here)s/cadence_db/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
