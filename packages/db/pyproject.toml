[project]
name = "cadence-db"
version = "0.1.0"
description = "Shared SQLAlchemy models for Cadence, used by apps/api and apps/worker."
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0", "alembic>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadence_db"]
