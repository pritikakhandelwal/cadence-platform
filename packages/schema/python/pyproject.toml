[project]
name = "cadence-schema"
version = "0.1.0"
description = "Canonical AnalysisResult contract shared by the Cadence API and worker."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadence_schema"]
